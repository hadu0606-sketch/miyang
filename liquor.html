<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>미양이네 - 주류</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- 로고 -->
    <header>
        <a href="main.html">
            <img src="image.png" class="logo">
        </a>
    </header>


    <!-- 카테고리 -->
    <div class="category">

        <a href="menu.html" data-i18n="menu">
            메뉴
        </a>

        <a href="liquor.html" class="active" data-i18n="liquor">
            주류
        </a>

        <a href="set.html" data-i18n="set">
            연맥 세트
        </a>

        <a href="side.html" data-i18n="side">
            사이드
        </a>

    </div>


    <!-- 주류 메뉴 -->
    <div class="menu">

        <!-- 연태고량 (소) -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="yantai_small">
                    연태고량 (소)
                </h2>

                <span data-i18n="yantai_small_price">
                    15,000원
                </span>

            </div>

        </div>


        <!-- 연태고량 (중) -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="yantai_medium">
                    연태고량 (중)
                </h2>

                <span data-i18n="yantai_medium_price">
                    25,000원
                </span>

            </div>

        </div>


        <!-- 연태고량 (대) -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="yantai_large">
                    연태고량 (대)
                </h2>

                <span data-i18n="yantai_large_price">
                    45,000원
                </span>

            </div>

        </div>


        <!-- 공부가주 (소) -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="gongbugaju_small">
                    공부가주 (소)
                </h2>

                <span data-i18n="gongbugaju_small_price">
                    30,000원
                </span>

            </div>

        </div>


        <!-- 칭따오 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="qingdao">
                    칭따오
                </h2>

                <p data-i18n="qingdao_size">
                    640ml
                </p>

                <span data-i18n="qingdao_price">
                    8,000원
                </span>

            </div>

        </div>


        <!-- 하얼빈 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="harbin">
                    하얼빈
                </h2>

                <p data-i18n="harbin_size">
                    500ml
                </p>

                <span data-i18n="harbin_price">
                    8,000원
                </span>

            </div>

        </div>


        <!-- 소주 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="soju">
                    소주
                </h2>

                <p data-i18n="soju_detail">
                    참이슬 · 처음처럼 · 진로 · 새로
                </p>

                <span data-i18n="soju_price">
                    6,000원
                </span>

            </div>

        </div>


        <!-- 맥주 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="beer">
                    맥주
                </h2>

                <p data-i18n="beer_detail">
                    카스 / 테라
                </p>

                <span data-i18n="beer_price">
                    6,000원
                </span>

            </div>

        </div>


        <!-- 무알콜 맥주 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="non_alcoholic_beer">
                    무알콜 맥주
                </h2>

                <span data-i18n="non_alcoholic_beer_price">
                    3,000원
                </span>

            </div>

        </div>


        <!-- 음료수 -->
        <div class="card">

            <div class="info">

                <h2 data-i18n="drinks">
                    음료수
                </h2>

                <p data-i18n="drinks_detail">
                    콜라(일반/제로) ·
                    사이다(일반/제로) ·
                    환타(오렌지/파인)
                </p>

                <span data-i18n="drinks_price">
                    2,000원
                </span>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
