<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>미양이네 주류</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <img src="image.png" class="logo">


</header>



<div class="category">
    <button class="active">주류</button>
    <button class="active">연맥 세트</button>
</div>



<div class="menu">

    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>연태고량 (소)</h2>

            <span>15,000원</span>

        </div>

    </div>





    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>연태고량 (중)</h2>

            <span>25,000원</span>

        </div>

    </div>

    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>연태고량 (대)</h2>

            <span>45,000원</span>

        </div>

    </div>



    <div class="card">

       <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>칭따오</h2>

            <p>330ml</p>

            <span>8,000원</span>

        </div>

    </div>




    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>하얼빈</h2>

            <p>500ml</p>

            <span>8,000원</span>

        </div>

    </div>




    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>소주</h2>

            <p>참이슬 / 처음처럼</p>

            <span>6,000원</span>

        </div>

    </div>


    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>맥주</h2>

            <p>카스 / 테라</p>

            <span>6,000원</span>

        </div>

    </div>



    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>무알콜 맥주</h2>

            <span>3,000원</span>

        </div>

    </div>


    <div class="card">

        <!--<img src="soju.jpg">-->

        <div class="info">

            <h2>음료수</h2>

            <p>콜라(일반/제로) · 사이다(일반/제로) · 환타(오렌지/파인)</p>

            <span>2,000원</span>

        </div>

    </div>

</div>

</body>

</html>
